[project]
name = "pdfx"
version = "0.1.0"
description = "Extract full context from PDFs for coding agents, with optional LlamaParse cloud extraction."
requires-python = ">=3.14"
dependencies = [
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2.3",
    "llama-cloud>=2.1",
    "python-dotenv>=1.2.2",
]
